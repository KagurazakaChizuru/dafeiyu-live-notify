name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法 + 自检
    runs-on: windows-latest
    # 兜底：自检一旦挂住，这里让它 15 分钟就死，而不是耗到默认的 6 小时。
    # 2026-09-19 那 6 次运行就是挂着不动，一直耗到作业上限才被掐掉。
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 放在最前面：这个坑会让脚本「能跑但结果是错的」，比直接报错更难查。
      #   .bat  必须纯 ASCII（cmd 按 OEM 代码页读，中文会让字节偏移错位）
      #   .ps1  要么纯 ASCII，要么带 BOM。中文 + 无 BOM 时 PowerShell 5.1
      #         按 ANSI 解码，奇数个高位字节会吃掉行尾换行，下一行代码
      #         变成注释 —— 静默失效。_package.ps1 就这样丢过一次变量赋值。
      - name: 脚本编码检查
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Recurse -File -Include *.bat,*.ps1 |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              $b = [System.IO.File]::ReadAllBytes($_.FullName)
              if (($b | Where-Object { $_ -gt 127 }).Count -eq 0) { return }
              $bom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
              if (-not $bom) { $bad += $_.FullName }
            }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error file=$_::有非 ASCII 字节但没有 BOM" }
            exit 1
          }
          Write-Host "编码检查通过"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法检查
        run: python -m py_compile live_notify.py triggers.py games.py gui.py

      # 这一条比作业超时更短：真挂住时先红的是它，报出来就是「自检挂死」，
      # 而不是整个作业超时后一句含糊的「The operation was canceled」。
      - name: 端到端自检（用假 NapCat，不联网）
        timeout-minutes: 5
        run: python _selftest.py

      # 配置文件示例必须能原样加载 —— 它是文档里让人照抄的东西，
      # 改了字段却忘了改示例的话，用户第一步就卡住。
      - name: 配置示例可加载
        run: |
          python -c "import json,pathlib; d=json.loads(pathlib.Path('config.example.json').read_text(encoding='utf-8-sig')); d['groups'][0]['group_id']=123456789; pathlib.Path('_ci-config.json').write_text(json.dumps(d,ensure_ascii=False),encoding='utf-8')"
          python live_notify.py check --config _ci-config.json || true
